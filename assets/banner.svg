<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <style>
      .title { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 42px; fill: url(#textGrad); }
      .subtitle { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
      .badge-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 14px; fill: #ffffff; }
      
      @keyframes floatParticle {
        0% { transform: translateY(0px) rotate(0deg); opacity: 0.3; }
        50% { transform: translateY(-20px) rotate(180deg); opacity: 0.8; }
        100% { transform: translateY(0px) rotate(360deg); opacity: 0.3; }
      }
      
      @keyframes pulseGlow {
        0% { opacity: 0.4; transform: scale(0.98); }
        50% { opacity: 0.8; transform: scale(1.02); }
        100% { opacity: 0.4; transform: scale(0.98); }
      }

      .p1 { animation: floatParticle 8s ease-in-out infinite; transform-origin: center; }
      .p2 { animation: floatParticle 12s ease-in-out infinite 2s; transform-origin: center; }
      .p3 { animation: floatParticle 10s ease-in-out infinite 4s; transform-origin: center; }
      .glow-bg { animation: pulseGlow 6s ease-in-out infinite; transform-origin: center; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Dynamic Glowing Orbs in Background (behind text) -->
  <circle class="glow-bg" cx="200" cy="100" r="140" fill="#6366f1" opacity="0.25" filter="url(#glow)" />
  <circle class="glow-bg" cx="1000" cy="260" r="160" fill="#a855f7" opacity="0.2" filter="url(#glow)" />
  <circle class="glow-bg" cx="600" cy="180" r="120" fill="#06b6d4" opacity="0.15" filter="url(#glow)" />

  <!-- Animated Floating Tech Icons/Nodes in Background -->
  <g class="p1">
    <polygon points="120,80 140,110 100,110" fill="#38bdf8" opacity="0.4" />
    <circle cx="1020" cy="80" r="12" fill="#ec4899" opacity="0.3" />
  </g>
  <g class="p2">
    <rect x="1050" y="220" width="24" height="24" rx="4" fill="#818cf8" opacity="0.4" transform="rotate(45 1062 232)" />
    <circle cx="150" cy="280" r="18" fill="#34d399" opacity="0.3" />
  </g>
  <g class="p3">
    <polygon points="920,290 940,320 900,320" fill="#fb923c" opacity="0.4" />
    <rect x="80" y="200" width="16" height="16" rx="3" fill="#c084fc" opacity="0.3" transform="rotate(25 88 208)" />
  </g>

  <!-- Decorative Grid Overlay -->
  <path d="M0 60 H1200 M0 120 H1200 M0 180 H1200 M0 240 H1200 M0 300 H1200" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1" />
  <path d="M200 0 V360 M400 0 V360 M600 0 V360 M800 0 V360 M1000 0 V360" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1" />

  <!-- Foreground Content: Header Cards and Pills -->
  <!-- Top Category Pill -->
  <g transform="translate(425, 45)">
    <rect width="350" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1" />
    <text x="175" y="22" text-anchor="middle" class="badge-text" fill="#38bdf8">⚡ CURATED ECOSYSTEM &amp; PLATFORMS</text>
  </g>

  <!-- Foreground Main Title & Subtitle (Always Crisp & On Top) -->
  <text x="600" y="135" text-anchor="middle" class="title" filter="url(#glow)">Awesome Developer Environment Management</text>
  <text x="600" y="175" text-anchor="middle" class="subtitle">Cloud Development Environments (CDE), DevContainers &amp; Workspace Orchestration</text>

  <!-- Bottom Feature Pills -->
  <g transform="translate(180, 235)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="240" height="48" rx="12" fill="#0f172a" fill-opacity="0.7" stroke="#38bdf8" stroke-width="1.5" />
      <text x="120" y="29" text-anchor="middle" class="badge-text">☁️ Cloud IDEs &amp; CDEs</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(260, 0)">
      <rect width="260" height="48" rx="12" fill="#0f172a" fill-opacity="0.7" stroke="#818cf8" stroke-width="1.5" />
      <text x="130" y="29" text-anchor="middle" class="badge-text">🐳 DevContainer Standards</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(540, 0)">
      <rect width="280" height="48" rx="12" fill="#0f172a" fill-opacity="0.7" stroke="#c084fc" stroke-width="1.5" />
      <text x="140" y="29" text-anchor="middle" class="badge-text">🤖 Ephemeral AI Sandboxes</text>
    </g>
  </g>
</svg>

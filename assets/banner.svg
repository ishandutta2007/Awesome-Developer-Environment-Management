<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 360"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#311042"/></linearGradient><linearGradient id="textGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#f43f5e"/><stop offset="100%" stop-color="#fb923c"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><style>@keyframes floatParticle{0%{transform:translateY(0) rotate(0deg);opacity:.3}50%{transform:translateY(-20px) rotate(180deg);opacity:.8}}@keyframes pulseGlow{0%{opacity:.4;transform:scale(.98)}50%{opacity:.8;transform:scale(1.02)}}.badge-text,.subtitle,.title{font-family:&apos;Segoe UI&apos;,system-ui,-apple-system,sans-serif}.title{font-weight:800;font-size:42px;fill:url(#textGrad)}.subtitle{font-weight:500;font-size:20px;fill:#94a3b8}.badge-text{font-weight:600;font-size:14px;fill:#fff}.glow-bg{transform-origin:center}.p1{animation:floatParticle 8s ease-in-out infinite}.p1,.p2,.p3{transform-origin:center}.p2{animation:floatParticle 12s ease-in-out infinite 2s}.p3{animation:floatParticle 10s ease-in-out infinite 4s}.glow-bg{animation:pulseGlow 6s ease-in-out infinite}</style></defs><rect width="1200" height="360" fill="url(#bgGrad)" rx="16"/><circle cx="200" cy="100" r="140" fill="#6366f1" class="glow-bg" filter="url(#glow)" opacity=".25"/><circle cx="1000" cy="260" r="160" fill="#a855f7" class="glow-bg" filter="url(#glow)" opacity=".2"/><circle cx="600" cy="180" r="120" fill="#06b6d4" class="glow-bg" filter="url(#glow)" opacit